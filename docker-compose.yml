# Local backing services for EVM Nexus (SPEC §15). Only the Next app + worker run
# on the host; everything else runs here. `docker compose up -d`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: evm_nexus
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus -d evm_nexus']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus-secret
    ports: ['9000:9000', '9001:9001']
    volumes: ['miniodata:/data']

  # Optional local EVM chain for testing.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ['anvil']
    command: ['--host', '0.0.0.0', '--chain-id', '31337']
    ports: ['8545:8545']

volumes:
  pgdata: {}
  miniodata: {}
