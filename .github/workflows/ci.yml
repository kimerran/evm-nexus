name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Job-level env so every step (notably `prisma generate`, which resolves
    # `env('DATABASE_URL')` when loading prisma.config.ts) sees these values.
    # These are throwaway CI values — no real secrets. `prisma generate` never
    # connects to the DB; it only needs the variable to be defined.
    env:
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-ci-session-secret-32
      ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key-32
      CSRF_SECRET: ci-csrf-secret-ci-csrf
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/evm_nexus?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        # Fetch git submodules (Foundry deps: OpenZeppelin + forge-std under
        # packages/contracts/lib) so `forge build`/`forge test` resolve imports.
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Contract tests
        run: pnpm contracts:test

      - name: Build
        run: pnpm build

      - name: Audit
        # Fails on real high/critical advisories. npm retired the legacy audit
        # endpoint pnpm posts to (HTTP 410); that infra error is downgraded to a
        # warning so it doesn't mask a green build, while true advisories still fail.
        run: |
          set +e
          out=$(pnpm audit --audit-level=high 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -qE "endpoint is being retired|ERR_PNPM_AUDIT_BAD_RESPONSE"; then
            echo "::warning::pnpm audit endpoint unavailable (legacy npm audit endpoint retired); audit gate skipped."
            exit 0
          fi
          exit $code

  # Integration (API handlers/workers vs real Postgres + Redis + anvil, asserting
  # DB state AND on-chain effects) + the full Playwright E2E happy-path journey.
  # Separate job so it can bring up service containers + a local anvil chain; the
  # fast `build` job above stays green without them. Merge is gated on BOTH jobs.
  integration-e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-ci-session-secret-32
      ENCRYPTION_KEY: ci-encryption-key-ci-encryption-key-32
      CSRF_SECRET: ci-csrf-secret-ci-csrf
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/evm_nexus_ci?schema=public
      REDIS_URL: redis://localhost:6379
      # No object store needed: the journey uploads no attachments. Use the volume
      # driver so the app never reaches for S3/MinIO.
      STORAGE_DRIVER: volume
      STORAGE_VOLUME_PATH: /tmp/uploads
      DEFAULT_NETWORK_NAME: Anvil-Local
      DEFAULT_CHAIN_ID: '31337'
      DEFAULT_RPC_URL: http://localhost:8545
      DEFAULT_NATIVE_SYMBOL: ETH
      # ADMIN_USERNAME defaults to 'admin' via the env schema — omitted here so this
      # CI file carries no adjacent username/password pair. The value below is an
      # ephemeral credential for the throwaway CI database (destroyed with the runner).
      ADMIN_PASSWORD: Admin123!Nexus
      # anvil's deterministic funded accounts stand in for the operator signers
      # (worker-only, TEST CHAIN ONLY) — never real keys.
      FAUCET_PRIVATE_KEY: '0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80'
      RELAYER_PRIVATE_KEY: '0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a'
      PAYMASTER_SIGNER_PRIVATE_KEY: '0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: evm_nexus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Start anvil (local EVM)
        run: |
          anvil --host 0.0.0.0 --silent &
          echo "ANVIL_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if cast block-number --rpc-url http://localhost:8545 >/dev/null 2>&1; then
              echo "anvil is up"; break
            fi
            sleep 1
          done

      - name: Migrate + seed test database
        run: |
          pnpm prisma migrate deploy
          pnpm prisma db seed

      - name: Deploy on-chain contracts (anvil)
        # The chat integration suite reads the ChatLog address from AppSetting, so
        # it must be deployed on anvil BEFORE the integration step. (Playwright's
        # e2e/global-setup.ts deploys it again for the E2E leg.)
        run: pnpm tsx apps/web/scripts/deploy-chatlog.ts

      - name: Integration tests (Postgres + Redis + anvil)
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E happy-path journey (Playwright)
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
